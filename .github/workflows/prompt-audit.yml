name: prompt-audit

# 互守闭环（AI 安全三部曲 · §三.3）：bounty-guard 的 MCP 工具描述由 prompt-audit 审——
# 「接 AI 时 prompt-audit 审 AI 资产」这一闸反守自家：工具描述即模型会读的文本
on:
  pull_request:
    paths:
      - 'mcp-manifest.json'
      - 'src/mcp/**'
      - '.github/workflows/prompt-audit.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Croesus-K/prompt-audit@main
        with:
          fail-on: high
